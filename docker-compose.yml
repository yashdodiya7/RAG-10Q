services:
  neo4j:
    image: neo4j:5.26-community
    container_name: rag10q-neo4j
    # Host ports are configurable: Windows (Hyper-V/WSL) often reserves 7474/7687.
    # If so, set NEO4J_HTTP_PORT=17474, NEO4J_BOLT_PORT=17687 and NEO4J_URI=bolt://localhost:17687 in .env
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # Neo4j Browser
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-rag10q-dev-password}
      # APOC utilities + neosemantics (n10s) for importing the OWL ontology / RDF into Neo4j
      NEO4J_PLUGINS: '["apoc", "n10s"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,n10s.*
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
